<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="300" fill="#fff"/>
  <text x="380" y="24" text-anchor="middle" font-weight="600">Pre-clip: each source tile keeps only what lies in its own unbuffered extent</text>

  <!-- Left: as stored in the archive -->
  <text x="170" y="52" text-anchor="middle" fill="#555">As stored (tiles overlap through their buffers)</text>
  <!-- buffers -->
  <rect x="42" y="62" width="136" height="136" fill="none" stroke="#aaa" stroke-dasharray="4 3"/>
  <rect x="162" y="62" width="136" height="136" fill="none" stroke="#aaa" stroke-dasharray="4 3"/>
  <!-- tiles -->
  <rect x="50" y="70" width="120" height="120" fill="none" stroke="#555"/>
  <rect x="170" y="70" width="120" height="120" fill="none" stroke="#555"/>
  <text x="110" y="208" text-anchor="middle" font-size="12">tile A</text>
  <text x="230" y="208" text-anchor="middle" font-size="12">tile B</text>
  <!-- the same polygon in both tiles, each copy running into the other's buffer -->
  <path d="M 120 100 L 176 92 L 178 150 L 130 160 Z" fill="#e76f51" fill-opacity="0.35" stroke="#e76f51"/>
  <path d="M 120 100 L 176 92 L 178 150 L 130 160 Z" fill="#e76f51" fill-opacity="0.35" stroke="#e76f51" transform="translate(0.8 0.8)"/>
  <text x="170" y="238" text-anchor="middle" fill="#e76f51" font-size="12">a polygon crossing the edge is in both tiles, each copy</text>
  <text x="170" y="254" text-anchor="middle" fill="#e76f51" font-size="12">cut at the far buffer; merged as is, it is painted twice</text>

  <!-- Arrow -->
  <path d="M 320 130 L 380 130" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M 372 124 L 382 130 L 372 136" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Right: after the pre-clip -->
  <text x="560" y="52" text-anchor="middle" fill="#555" font-size="12">After the pre-clip: lines and rings to [0, extent], points to [0, extent)</text>
  <rect x="440" y="70" width="120" height="120" fill="none" stroke="#555"/>
  <rect x="560" y="70" width="120" height="120" fill="none" stroke="#555"/>
  <text x="500" y="208" text-anchor="middle" font-size="12">tile A</text>
  <text x="620" y="208" text-anchor="middle" font-size="12">tile B</text>
  <!-- A's part -->
  <path d="M 510 100 L 560 93 L 560 155 L 520 160 Z" fill="#e76f51" fill-opacity="0.45" stroke="#e76f51"/>
  <!-- B's part -->
  <path d="M 560 93 L 566 92 L 568 150 L 560 155 Z" fill="#2a9d8f" fill-opacity="0.45" stroke="#2a9d8f"/>
  <!-- points on the shared edge -->
  <circle cx="560" cy="120" r="3" fill="#2a9d8f"/>
  <text x="570" y="124" font-size="11" fill="#2a9d8f">x = extent → B only</text>
  <circle cx="559" cy="178" r="3" fill="#e76f51"/>
  <text x="456" y="182" font-size="11" fill="#e76f51">x = extent − 1 → A</text>
  <text x="560" y="238" text-anchor="middle" fill="#555" font-size="12">The parts abut exactly along the shared edge: fills are painted once;</text>
  <text x="560" y="254" text-anchor="middle" fill="#555" font-size="12">lines and outlines are split there; a point belongs to one tile.</text>
  <text x="380" y="286" text-anchor="middle" fill="#777" font-size="11">Done once per source tile when it is decoded; the result is what the per-isolate cache keeps.</text>
</svg>
