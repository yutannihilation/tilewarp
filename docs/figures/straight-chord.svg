<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="380" fill="#fff"/>
<text x="380" y="24" text-anchor="middle" font-weight="600">The grid measures how much the transform bends, which gives the tile's segment limit</text>
<text x="190" y="60" text-anchor="middle" fill="#555">three grid images in a row (also a column, a diagonal)</text>
<path d="M 50,230 Q 190 85 330,200" fill="none" stroke="#2a9d8f" stroke-width="2"/>
<line x1="50" y1="230" x2="330" y2="200" stroke="#999" stroke-dasharray="5 4"/>
<line x1="190" y1="215" x2="190" y2="150" stroke="#d62828" stroke-width="1.5"/>
<circle cx="50" cy="230" r="4" fill="#1f77b4"/><circle cx="330" cy="200" r="4" fill="#1f77b4"/><circle cx="190" cy="150" r="4" fill="#1f77b4"/>
<circle cx="190" cy="215" r="3" fill="#999"/>
<text x="50" y="250" text-anchor="middle">p₀</text><text x="330" y="220" text-anchor="middle">p₂</text><text x="190" y="140" text-anchor="middle">p₁</text>
<text x="198" y="186.5" fill="#d62828" font-size="12">stray d</text>
<text x="200" y="231" fill="#777" font-size="12">chord, length L</text>
<text x="300" y="130" fill="#2a9d8f" font-size="12">the curve the</text><text x="300" y="144" fill="#2a9d8f" font-size="12">transform draws</text>
<rect x="30" y="270" width="340" height="86" rx="6" fill="#fff3c4" stroke="#c9a227"/>
<text x="200" y="292" text-anchor="middle" font-size="12">A chord of length L strays by d from the curve.</text>
<text x="200" y="310" text-anchor="middle" font-size="12">Bending grows with the square of the length, so</text>
<text x="200" y="330" text-anchor="middle" font-size="13">a chord of length L · √(1 / d) bends by 1 unit</text>
<text x="200" y="348" text-anchor="middle" font-size="12">(the tolerance). That is this triple's limit.</text>
