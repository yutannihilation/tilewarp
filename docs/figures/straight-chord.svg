<text x="550" y="318" text-anchor="middle" font-size="12"><tspan fill="#1f77b4">rows</tspan>, <tspan fill="#2a9d8f">columns</tspan> and <tspan fill="#e76f51">both</tspan> <tspan fill="#9467bd">diagonals</tspan>.</text>
<text x="550" y="340" text-anchor="middle" font-size="12">The tile's limit is the smallest of their limits.</text>
<text x="550" y="358" text-anchor="middle" font-size="12">If it exceeds the image's diagonal, nothing in the tile is densified.</text>
