<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="230" fill="#fff"/>
  <text x="380" y="24" text-anchor="middle" font-weight="600">Bisection along a cell edge, from a sample with a position to one without</text>

  <!-- the edge -->
  <line x1="80" y1="110" x2="680" y2="110" stroke="#9ecae1" stroke-width="2"/>
  <!-- where the positions end -->
  <line x1="548" y1="62" x2="548" y2="140" stroke="#d62828" stroke-dasharray="4 3"/>
  <text x="548" y="52" text-anchor="middle" fill="#d62828" font-size="12">positions end here (unknown to the code)</text>
  <!-- ends -->
  <circle cx="80" cy="110" r="5" fill="#1f77b4"/>
  <text x="80" y="134" text-anchor="middle">a: positioned</text>
  <path d="M676,106 l8,8 m0,-8 l-8,8" stroke="#d62828" stroke-width="1.5" fill="none"/>
  <text x="680" y="134" text-anchor="middle" fill="#d62828">b: no position</text>
  <!-- steps: midpoints, each transformed once -->
  <g font-size="11">
    <circle cx="380" cy="110" r="3.5" fill="#1f77b4"/><text x="380" y="98" text-anchor="middle">1: yes → a</text>
    <path d="M527,107 l6,6 m0,-6 l-6,6" stroke="#d62828" stroke-width="1.5" fill="none"/><text x="530" y="78" text-anchor="middle" fill="#d62828">2: no → b</text>
    <circle cx="455" cy="110" r="3.5" fill="#1f77b4"/><text x="455" y="128" text-anchor="middle">3: yes → a</text>
    <circle cx="492.5" cy="110" r="3.5" fill="#1f77b4"/><text x="486" y="98" text-anchor="middle">4: yes</text>
    <circle cx="511" cy="110" r="3.5" fill="#1f77b4"/><text x="511" y="128" text-anchor="middle">5: yes</text>
    <circle cx="520.5" cy="110" r="3.5" fill="#1f77b4"/>
    <circle cx="525" cy="110" r="3.5" fill="#1f77b4"/>
  </g>
  <text x="625" y="150" text-anchor="middle" font-size="11" fill="#555">… 8 halvings in all</text>
  <!-- returned point -->
  <circle cx="525" cy="110" r="6" fill="none" stroke="#d62828" stroke-width="1.5"/>
  <text x="330" y="172" text-anchor="middle" fill="#d62828" font-size="12">returned: the last point with a position</text>
  <line x1="440" y1="168" x2="521" y2="115" stroke="#d62828" stroke-width="1"/>

  <text x="380" y="204" text-anchor="middle" font-size="12">Each halving transforms one point. After eight, the returned point is within 1/256 of the edge's length</text>
  <text x="380" y="220" text-anchor="middle" font-size="12">(about half an output unit) of where the positions end, and the cell's box is extended to it.</text>
</svg>
