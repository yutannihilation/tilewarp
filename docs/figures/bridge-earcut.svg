<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
<rect width="680" height="290" fill="#fff"/>
<title>What MapLibre draws for the crossing ring</title><desc>MapLibre splits the ring into triangles with earcut. Because the ring crosses itself, earcut produces a triangle spanning from d to c to a vertex of the right arm, which paints water over the land between the arms, as in the Sam Ford Fiord screenshots.</desc><path d="M200 50L278 50L278 170L374 163L374 50L480 50L480 210L340 160L200 210Z" fill="#378ADD"/><polygon points="200,210 480,210 374,50" fill="#E24B4A" fill-opacity="0.35" stroke="#A32D2D" stroke-width="1.5" stroke-linejoin="round"/><line stroke="#888" stroke-width="0.6" stroke-dasharray="3 2" x1="300" y1="120" x2="508" y2="96"/><circle cx="300" cy="120" r="2" fill="#A32D2D"/><text font-size="12" fill="#555" x="514" y="92">Extra triangle from earcut</text><text font-size="12" fill="#555" x="514" y="108">painted over land</text><g transform="translate(40 246)"><rect width="10" height="10" fill="#378ADD"/><text font-size="12" fill="#555" x="16" y="9">The ring's real area (water)</text><rect x="210" width="10" height="10" fill="#E24B4A" fill-opacity="0.35" stroke="#A32D2D" stroke-width="1"/><text font-size="12" fill="#555" x="226" y="9">Filled by mistake (schematic)</text></g></svg>
