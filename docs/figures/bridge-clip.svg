<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
<rect width="680" height="380" fill="#fff"/>
<title>How clipping makes a bridge</title><desc>Left: a U-shaped water polygon whose bottom lies outside the source tile, so inside the tile it is two separate arms. Right: after Sutherland–Hodgman clipping it is one ring whose edges along the tile edge run a to b and later c to d, so the stretch between a and b is traversed out and back: a zero-width bridge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><clipPath id="tileclip"><rect x="40" y="40" width="260" height="200"/></clipPath></defs><path d="M80 90L130 90L130 280L210 280L210 90L260 90L260 310L80 310Z" fill="#B5D4F4"/><path d="M80 90L130 90L130 280L210 280L210 90L260 90L260 310L80 310Z" fill="#378ADD" clip-path="url(#tileclip)"/><rect x="40" y="40" width="260" height="200" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><path d="M420 90L470 90L470 240L550 240L550 90L600 90L600 240L420 240Z" fill="#378ADD"/><rect x="380" y="40" width="260" height="200" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><line x1="472" y1="230" x2="546" y2="230" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="598" y1="250" x2="424" y2="250" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text font-size="12" fill="#555" x="470" y="270" text-anchor="middle">a</text><text font-size="12" fill="#555" x="550" y="270" text-anchor="middle">b</text><text font-size="12" fill="#555" x="600" y="270" text-anchor="middle">c</text><text font-size="12" fill="#555" x="420" y="270" text-anchor="middle">d</text><text font-size="13" fill="#333" font-weight="600" x="170" y="342" text-anchor="middle">Source polygon</text><text font-size="12" fill="#555" x="170" y="360" text-anchor="middle">Leaves the tile and comes back</text><text font-size="13" fill="#333" font-weight="600" x="510" y="342" text-anchor="middle">After clipping (one ring)</text><text font-size="12" fill="#555" x="510" y="360" text-anchor="middle">a→b, later c→d: a–b is a bridge</text></svg>
