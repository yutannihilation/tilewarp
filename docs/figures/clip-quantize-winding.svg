<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#1f77b4"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fff"/>
  <text x="380" y="24" text-anchor="middle" font-weight="600">After the transform: clip to the buffered output tile, quantize, fix the winding</text>

  <!-- 1. clip -->
  <text x="130" y="52" text-anchor="middle" fill="#555">1. Clip (Sutherland–Hodgman for rings,</text>
  <text x="130" y="68" text-anchor="middle" fill="#555">Cohen–Sutherland for lines)</text>
  <rect x="60" y="90" width="140" height="140" fill="none" stroke="#1f77b4" stroke-dasharray="4 3"/>
  <rect x="70" y="100" width="120" height="120" fill="#e8f1fa" stroke="#1f77b4"/>
  <!-- ring partly outside the buffer -->
  <path d="M 120 120 L 240 110 L 250 190 L 150 215 L 100 170 Z" fill="none" stroke="#bbb" stroke-dasharray="3 3"/>
  <path d="M 120 120 L 200 113 L 200 203 L 150 215 L 100 170 Z" fill="#e76f51" fill-opacity="0.4" stroke="#e76f51" stroke-width="1.5"/>
  <text x="130" y="252" text-anchor="middle" font-size="11">edges may run along the boundary</text>
  <text x="130" y="268" text-anchor="middle" font-size="11">(MVT accepts that); empty rings go</text>

  <!-- 2. quantize -->
  <text x="380" y="52" text-anchor="middle" fill="#555">2. Quantize to integers</text>
  <text x="380" y="68" text-anchor="middle" fill="#555">(repeated points and collapsed rings go)</text>
  <g stroke="#ddd">
    <line x1="300" y1="100" x2="460" y2="100"/><line x1="300" y1="130" x2="460" y2="130"/><line x1="300" y1="160" x2="460" y2="160"/><line x1="300" y1="190" x2="460" y2="190"/><line x1="300" y1="220" x2="460" y2="220"/>
    <line x1="300" y1="100" x2="300" y2="220"/><line x1="330" y1="100" x2="330" y2="220"/><line x1="360" y1="100" x2="360" y2="220"/><line x1="390" y1="100" x2="390" y2="220"/><line x1="420" y1="100" x2="420" y2="220"/><line x1="450" y1="100" x2="450" y2="220"/>
  </g>
  <polyline points="312,118 355,108 338,152 341,154 413,172 372,205" fill="none" stroke="#bbb" stroke-dasharray="3 3"/>
  <polyline points="300,130 360,100 330,160 420,160 360,220" fill="none" stroke="#e76f51" stroke-width="1.5"/>
  <g fill="#e76f51"><circle cx="300" cy="130" r="3"/><circle cx="360" cy="100" r="3"/><circle cx="330" cy="160" r="3"/><circle cx="420" cy="160" r="3"/><circle cx="360" cy="220" r="3"/></g>
  <text x="380" y="252" text-anchor="middle" font-size="11">points that round to the same integers merge;</text>
  <text x="380" y="268" text-anchor="middle" font-size="11">a ring with &lt; 3 points or no area is dropped</text>

  <!-- 3. winding -->
  <text x="630" y="52" text-anchor="middle" fill="#555">3. Winding by role (decided at decode time)</text>
  <text x="630" y="68" text-anchor="middle" fill="#555">y-down surveyor's formula</text>
  <path d="M 560 100 L 700 100 L 700 220 L 560 220 Z" fill="#e8f1fa" stroke="#1f77b4" stroke-width="1.5"/>
  <path d="M 595 135 L 595 185 L 665 185 L 665 135 Z" fill="#fff" stroke="#1f77b4" stroke-width="1.5"/>
  <!-- direction arrows -->
  <path d="M 590 96 L 670 96" stroke="#1f77b4" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <path d="M 591 182 L 591 138" stroke="#1f77b4" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>
  <text x="630" y="118" text-anchor="middle" font-size="12">exterior: area &gt; 0</text>
  <text x="636" y="165" text-anchor="middle" font-size="12">hole: area &lt; 0</text>
  <text x="630" y="252" text-anchor="middle" font-size="11">a ring whose sign disagrees with its role</text>
  <text x="630" y="268" text-anchor="middle" font-size="11">(reflected axes, rounding) is reversed</text>
  <text x="380" y="292" text-anchor="middle" fill="#777" font-size="11">Features are then merged by layer name across source tiles and encoded as MVT v2 with extent 8192.</text>
</svg>
