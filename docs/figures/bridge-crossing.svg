<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13">
<rect width="680" height="320" fill="#fff"/>
<title>After projection the bridge's two passes cross</title><desc>The tile edge becomes a curve. The long edge c to d is densified with one added point m, which lies on the curve, so its chords sag below the curve near a and b. The short edge a to b is a chord between two points on the curve. The long path rises above the short chord near m, so the two passes cross twice and the ring intersects itself. Exaggerated.</desc><path d="M200 50L278 50L278 170L374 163L374 50L480 50L480 210L340 160L200 210Z" fill="#378ADD" fill-rule="nonzero"/><path d="M200 210Q340 110 480 210" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><path d="M480 210L340 160L200 210" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linejoin="round"/><line x1="278" y1="170" x2="374" y2="163" stroke="#534AB7" stroke-width="2.5" stroke-linecap="round"/><circle cx="322" cy="166" r="5" fill="none" stroke="#A32D2D" stroke-width="1.5"/><circle cx="352" cy="164" r="5" fill="none" stroke="#A32D2D" stroke-width="1.5"/><circle cx="340" cy="160" r="3" fill="#D85A30"/><text font-size="12" fill="#555" x="286" y="152">a</text><text font-size="12" fill="#555" x="366" y="150" text-anchor="end">b</text><text font-size="12" fill="#555" x="340" y="146" text-anchor="middle">m</text><text font-size="12" fill="#555" x="194" y="228" text-anchor="middle">d</text><text font-size="12" fill="#555" x="486" y="228" text-anchor="middle">c</text><g transform="translate(40 256)"><line x1="0" y1="5" x2="18" y2="5" stroke="#888780" stroke-dasharray="5 4"/><text font-size="12" fill="#555" x="24" y="9">True curve of the tile edge</text><line x1="210" y1="5" x2="228" y2="5" stroke="#D85A30" stroke-width="2.5"/><text font-size="12" fill="#555" x="234" y="9">c→m→d, the long pass</text><line x1="400" y1="5" x2="418" y2="5" stroke="#534AB7" stroke-width="2.5"/><text font-size="12" fill="#555" x="424" y="9">a→b, the short pass</text></g><g transform="translate(40 282)"><circle cx="9" cy="5" r="5" fill="none" stroke="#A32D2D" stroke-width="1.5"/><text font-size="12" fill="#555" x="24" y="9">Where the two passes cross: the ring intersects itself (scale exaggerated)</text></g></svg>
