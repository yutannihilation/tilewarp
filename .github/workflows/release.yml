name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # OIDC for npm trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          # Never restore caches into a job that can publish.
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

      - run: bun run check

      - run: bun run build

      - run: bun run typecheck

      - run: bun run test

      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          # Strip build metadata; a "-" left over marks a prerelease.
          case "${version%%+*}" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
